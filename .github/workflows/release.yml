name: Build Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Conan
        shell: pwsh
        run: python -m pip install "conan>=2.0,<3.0"

      - name: Install dependencies
        shell: pwsh
        run: |
          conan profile detect --force
          conan install . --output-folder=build --build=missing -s build_type=Release -s compiler.runtime=static -s compiler.cppstd=17

      - name: Register Conan CMake presets
        shell: pwsh
        run: |
          @'
          {
            "version": 4,
            "vendor": {
              "conan": {}
            },
            "include": [
              "build/build/generators/CMakePresets.json"
            ]
          }
          '@ | Set-Content -LiteralPath CMakeUserPresets.json -Encoding utf8NoBOM

      - name: Configure and build
        shell: pwsh
        run: |
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Create distributable ZIP
        shell: pwsh
        working-directory: build/build
        run: cpack -C Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarakaMapTool-Windows
          path: build/build/NarakaMapTool-*-win64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem 'build/build/NarakaMapTool-*-win64.zip' | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $package.FullName --title '${{ github.ref_name }}' --generate-notes
